# Keeps the free-tier Supabase project from auto-pausing (~1 week of inactivity).
# A real REST query counts as project activity — twice a week gives plenty of
# margin so the DB is always awake for game night.
#
# This is one of two pingers. GitHub disables scheduled workflows after 60 days
# without repo activity, so the Worker also runs the same query daily from a
# Cloudflare Cron Trigger (wrangler.toml [triggers], src/lib/keepalive.ts).
# Either one alone keeps the project awake; keep both.
name: Supabase Keepalive

on:
  schedule:
    # Mondays and Thursdays at 16:00 UTC (9am PT)
    - cron: '0 16 * * 1,4'
  workflow_dispatch: # manual trigger for testing

# The job never touches the repo; read-only is the least GitHub allows.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Lightweight select against the players table. Only `id` is asked for:
          # browser_id and claim_code are not readable (migration 20261007000000).
          # -f makes curl exit non-zero on HTTP errors so a paused/broken
          # project fails the run and triggers a GitHub failure email.
          curl -sf -m 30 \
            "$SUPABASE_URL/rest/v1/players?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "Supabase is awake."
